# JWT Configuration
jwt:
  secret: ${JWT_SECRET:myVeryLongAndSecureSecretKeyForHS512Algorithm1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ}
  expiration: 24 # hours

# MyBatis Configuration (must be at top level, not under spring:)
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.socialmedia.sentiment.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true

# Logging
logging:
  level:
    com.socialmedia.sentiment: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sentiment-analysis.log
